<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truqui</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1>Truqui</h1>

    <section id="lobby">
      <p id="status">Truco argentino online</p>
      <button id="btn-start" type="button">Iniciar partida</button>
      <div id="share-box" hidden>
        <p>Compartí este link:</p>
        <input id="share-link" type="text" readonly>
        <button id="btn-copy" type="button">Copiar</button>
      </div>
    </section>

    <section id="game" hidden>
      <div id="scores"></div>
      <div id="table">
        <div id="opponent-area"></div>
        <div id="trick-area"></div>
        <div id="my-hand"></div>
      </div>
      <div id="actions"></div>
      <p id="msg"></p>
    </section>
  </main>

  <script src="/vendor/gun.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
