<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truqui</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1>Truqui</h1>

    <section id="lobby">
      <p id="status">Truco argentino P2P</p>
      <button id="btn-start" type="button">Iniciar partida</button>

      <div id="share-box" hidden>
        <p id="share-label">Compartí este link con tu rival:</p>
        <input id="share-link" type="text" readonly>
        <button id="btn-copy" type="button">Copiar</button>
      </div>

      <div id="answer-box" hidden>
        <p id="answer-label">Pegá el link de respuesta del rival:</p>
        <input id="answer-link" type="text" placeholder="http://…?r=…&a=…">
        <button id="btn-connect" type="button">Conectar</button>
      </div>

      <div id="response-box" hidden>
        <p>Mandale este link de vuelta al host:</p>
        <input id="response-link" type="text" readonly>
        <button id="btn-copy-response" type="button">Copiar respuesta</button>
      </div>
    </section>

    <section id="game" hidden>
      <div id="scores"></div>
      <div id="table">
        <div id="opponent-area"></div>
        <div id="trick-area"></div>
        <div id="my-hand"></div>
      </div>
      <div id="actions"></div>
      <p id="msg"></p>
    </section>
  </main>

  <script src="game.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
