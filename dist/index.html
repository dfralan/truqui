<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funnel — canal P2P</title>
  <meta name="description" content="Canal P2P por link. Objetos y scripts. Sin servidor, sin cuenta.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="stylesheet" href="funnel.css">
</head>
<body>
  <div class="shell">
    <header>
      <h1>Funnel</h1>
      <p class="lead">Un canal. Objetos. Scripts que los leen.</p>
    </header>

    <p id="status" class="status">Creá un canal o abrí un link</p>

    <section id="lobby">
      <button id="btn-start" type="button" class="btn btn-primary">Crear canal</button>

      <div id="share-box" class="panel panel-inset" hidden>
        <p class="label">Link de invitación</p>
        <input id="share-link" class="input" type="text" readonly>
        <button id="btn-copy" type="button" class="btn">Copiar</button>
      </div>

      <div id="answer-box" class="panel panel-inset" hidden>
        <p class="label">Link de respuesta</p>
        <input id="answer-link" class="input" type="text" placeholder="https://…?r=…&a=…">
        <button id="btn-connect" type="button" class="btn btn-primary">Conectar</button>
      </div>

      <div id="response-box" class="panel panel-inset" hidden>
        <p class="label">Mandale esto al host</p>
        <input id="response-link" class="input" type="text" readonly>
        <button id="btn-copy-response" type="button" class="btn">Copiar respuesta</button>
      </div>
    </section>

    <section id="canal" hidden>
      <div class="toolbar">
        <select id="script-select" class="input script-select" aria-label="Script">
          <option value="chat">Chat</option>
        </select>
        <button id="btn-plus" type="button" class="btn btn-primary btn-plus">+</button>
      </div>

      <div id="composer" class="panel" hidden>
        <p class="label">Nuevo objeto</p>
        <input id="obj-kind" class="input" type="text" value="funnel.message/1" spellcheck="false">
        <textarea id="obj-payload" class="input" rows="3" placeholder='{"text":"hola"} o texto suelto'></textarea>
        <button id="btn-publish" type="button" class="btn btn-primary">Publicar</button>
      </div>

      <div id="script-view" class="panel"></div>

      <div class="panel">
        <h2>Log</h2>
        <div id="timeline"></div>
      </div>
    </section>

    <a class="footer-link" href="truqui.html">Truqui — script de truco</a>
  </div>

  <script type="module" src="app/main.js"></script>
</body>
</html>
